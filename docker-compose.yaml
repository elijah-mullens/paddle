name: canoe

services:
  dev:
    image: canoe
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UBUNTU_VER: "22.04"
        PYHARP_VER: "1.8.8"
        KINTERA_VER: "1.2.10"
        SNAPY_VER: "1.2.7"
    environment:
      - USERNAME=${USER}
      - USER_UID=${USER_UID}
      - USER_GID=${USER_GID}
    volumes:
      - ..:/work
      - ${GITCONFIG}:/etc/gitconfig
      - ${GITCREDENTIALS}:/etc/git-credentials
    working_dir: /work
    tty: true
    stdin_open: true
    ports:
      - "8888:8888"
