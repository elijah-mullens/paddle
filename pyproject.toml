[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paddle"
version = "1.3.9"
description = "Python Atmospheric Dynamics: Discovery and Learning about Exoplanets. An open-source, user-friendly python frontend of canoe"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Elijah Mullens", email = "eem85@cornell.edu" },
  { name = "Cheng Li", email = "chengcli@umich.edu" },
]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
  "torch>=2.6.0",
  "snapy>=2.7.0",
  "scipy",
  "netCDF4",
  "rich>=13"
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/elijah-mullens/paddle"
Repository = "https://github.com/elijah-mullens/paddle"
Issues = "https://github.com/elijah-mullens/paddle/issues"

[project.scripts]
paddle = "paddle.__main__:main"
paddle-cs-shrink = "paddle.cubed_sphere_shrink:main"
paddle-cs-expand = "paddle.cubed_sphere_expand:main"
paddle-cs-remap = "paddle.cubed_sphere_remap:main"
paddle-refine = "paddle.restart_resize:refine_main"
paddle-coarsen = "paddle.restart_resize:coarsen_main"
paddle-restart = "paddle.restart_horizontal_stats:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
