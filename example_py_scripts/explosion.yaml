reference-state:
  Tref: 0.
  Pref: 1.e5

species:
  - name: dry
    composition: {O: 0.42, N: 1.56, Ar: 0.01}
    cv_R: 2.5

geometry:
  type: cartesian
  bounds: {x1min: -0.5, x1max: 0.5, x2min: -0.5, x2max: 0.5, x3min: -0.5, x3max: 0.5}
  cells: {nx1: 64, nx2: 64, nx3: 64, nghost: 3}

dynamics:
  equation-of-state:
    type: ideal-gas
    gammad: 1.4
    weight: 29.e-3
    density-floor: 1.e-10
    pressure-floor: 1.e-10
    limiter: false

  vertical-projection:
    type: none
    pressure-margin: 1.e-6

  reconstruct:
    vertical: {type: weno5, scale: false, shock: true}
    horizontal: {type: weno5, scale: false, shock: true}

  riemann-solver:
    type: hllc

boundary-condition:
  external:
    x1-inner: outflow
    x1-outer: outflow
    x2-inner: outflow
    x2-outer: outflow
    x3-inner: outflow
    x3-outer: outflow

integration:
  type: rk3
  cfl: 0.3
  implicit-scheme: 0
  nlim: 100
  tlim: 0.1
  ncycle_out: 10

outputs:
  - type: netcdf
    variables: [prim, uov]
    dt: 0.01

problem:
  p0: 1.0
  Ts: 10.0
  radius: 0.1
  dT: 1000.0
  dP: 1.0
  count: 5
